<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言包翻译管理工具 - 绿蓝双色主题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #d486ad 0%, #857aa9 25%, #9098ae 50%, #6fb898 75%, #c0bf86 100%);
            height: 100vh;
            min-height: 600px;
            padding: 16px;
            overflow: hidden;
            color: #2d3748;
        }

        .container {
            max-width: 1400px;
            height: calc(100vh - 32px);
            min-height: 560px;
            margin: 0 auto;
            background: linear-gradient(145deg, #ffffff 0%, #f8fffe 50%, #f0f9ff 100%);
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(72, 187, 120, 0.1), 0 8px 32px rgba(59, 130, 246, 0.05);
            border: 1px solid #e6fffa;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #48bb78 0%, #3b82f6 50%, #38a169 100%);
            color: white;
            padding: 24px 32px;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid #e6fffa;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.15), 0 4px 16px rgba(59, 130, 246, 0.1);
        }

        .header h1 {
            font-size: 1.75rem;
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .header p {
            font-size: 0.875rem;
            opacity: 0.9;
            font-weight: 400;
        }

        .main-content {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .sidebar {
            width: 300px;
            background: linear-gradient(180deg, #f0f9ff 0%, #e0f2fe 50%, #f7fafc 100%);
            border-right: 1px solid #e2e8f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h3 {
            color: #2d3748;
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 600;
        }

        .language-list {
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
        }

        .language-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #f8fffe 50%, #f0f9ff 100%);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            font-size: 0.875rem;
            box-shadow: 0 1px 3px rgba(72, 187, 120, 0.05);
        }

        .language-item:hover {
            background: linear-gradient(135deg, #f0fff4 0%, #dbeafe 50%, #e6fffa 100%);
            border-color: #c6f6d5;
            transform: translateX(2px);
            box-shadow: 0 2px 6px rgba(72, 187, 120, 0.1), 0 2px 6px rgba(59, 130, 246, 0.05);
        }

        .language-item.active {
            background: linear-gradient(135deg, #48bb78 0%, #3b82f6 50%, #38a169 100%);
            color: white;
            border-color: #38a169;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.3), 0 2px 8px rgba(59, 130, 246, 0.2);
        }

        .language-item.main-language {
            border: 2px solid #ffd700;
            background: linear-gradient(135deg, #ffffff 0%, #fffbeb 50%, #f0f9ff 100%);
            box-shadow: 0 2px 6px rgba(255, 215, 0, 0.2), 0 1px 3px rgba(72, 187, 120, 0.05);
        }

        .language-item.main-language:hover {
            background: linear-gradient(135deg, #fef3c7 0%, #dbeafe 50%, #e6fffa 100%);
            border-color: #f59e0b;
            box-shadow: 0 3px 8px rgba(255, 215, 0, 0.3), 0 2px 6px rgba(72, 187, 120, 0.1);
        }

        .language-item.main-language.active {
            background: linear-gradient(135deg, #f59e0b 0%, #48bb78 50%, #3b82f6 100%);
            color: white;
            border-color: #d97706;
            box-shadow: 0 3px 10px rgba(245, 158, 11, 0.4), 0 2px 8px rgba(72, 187, 120, 0.3);
        }

        .language-flag {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 10px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .content-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #48bb78 0%, #3b82f6 100%);
            color: white;
            border: 1px solid #48bb78;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #38a169 0%, #2563eb 100%);
            border-color: #38a169;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3), 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #38a169 0%, #10b981 100%);
            color: white;
            border: 1px solid #38a169;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #2f855a 0%, #059669 100%);
            border-color: #2f855a;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.3), 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .btn-warning {
            background: linear-gradient(135deg, #68d391 0%, #60a5fa 100%);
            color: white;
            border: 1px solid #68d391;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #48bb78 0%, #3b82f6 100%);
            border-color: #48bb78;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(104, 211, 145, 0.3), 0 4px 12px rgba(96, 165, 250, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #e2e8f0 0%, #dbeafe 100%);
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #cbd5e0 0%, #bfdbfe 100%);
            border-color: #cbd5e0;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(160, 174, 192, 0.2), 0 4px 8px rgba(191, 219, 254, 0.2);
        }

        .translation-editor {
            background: linear-gradient(145deg, #ffffff 0%, #f8fffe 50%, #f0f9ff 100%);
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            box-shadow: 0 2px 8px rgba(72, 187, 120, 0.05), 0 2px 8px rgba(59, 130, 246, 0.03);
        }

        .editor-header {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f7fafc 100%);
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .editor-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
        }

        .key-count {
            background: linear-gradient(135deg, #48bb78 0%, #3b82f6 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            box-shadow: 0 2px 4px rgba(72, 187, 120, 0.2), 0 2px 4px rgba(59, 130, 246, 0.1);
        }

        .translation-table {
            flex: 1;
            overflow-y: auto;
            min-height: 200px;
        }

        .translation-row {
            display: flex;
            border-bottom: 1px solid #f1f5f9;
            transition: background-color 0.2s ease;
        }

        .translation-row:hover {
            background: linear-gradient(135deg, #f8fffe 0%, #f0f9ff 50%, #f0fff4 100%);
        }

        .key-column {
            width: 200px;
            padding: 16px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f7fafc 100%);
            border-right: 1px solid #e2e8f0;
            font-weight: 500;
            color: #2d3748;
            word-break: break-word;
            font-size: 0.875rem;
        }

        .value-column {
            flex: 1;
            padding: 16px;
        }

        .value-input {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 0.875rem;
            line-height: 1.5;
            resize: vertical;
            min-height: 20px;
            color: #2d3748;
            font-family: inherit;
        }

        .value-input:focus {
            outline: 2px solid #48bb78;
            outline-offset: -2px;
            border-radius: 4px;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .status-bar {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f7fafc 100%);
            padding: 12px 20px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info {
            color: #718096;
            font-size: 0.875rem;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .spinner {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #48bb78;
            border-right: 3px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 响应式设计 */
        @media (max-height: 700px) {
            .header {
                padding: 15px 30px;
            }
            
            .header h1 {
                font-size: 1.8em;
                margin-bottom: 3px;
            }
            
            .header p {
                font-size: 0.9em;
            }
            
            .sidebar {
                padding: 15px;
            }
            
            .content-area {
                padding: 15px;
            }
        }

        @media (max-width: 1200px) {
            .container {
                margin: 0 10px;
                max-width: none;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                height: calc(100vh - 20px);
            }
            
            .main-content {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }
            
            .language-list {
                max-height: 120px;
            }
            
            .toolbar {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .btn {
                padding: 8px 16px;
                font-size: 12px;
            }
        }

        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.875rem;
            background: white;
            transition: border-color 0.2s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #48bb78;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.1), 0 0 0 6px rgba(59, 130, 246, 0.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(45, 55, 72, 0.4) 0%, rgba(59, 130, 246, 0.2) 100%);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #ffffff 0%, #f8fffe 50%, #f0f9ff 100%);
            padding: 24px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.1), 0 10px 25px rgba(59, 130, 246, 0.05);
            border: 1px solid #e6fffa;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.25rem;
            color: #2d3748;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #4a5568;
            font-size: 0.875rem;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.875rem;
            transition: border-color 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #48bb78;
            box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.1), 0 0 0 6px rgba(59, 130, 246, 0.05);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🙀 语言包翻译管理工具</h1>
            <p>简洁高效的多语言翻译管理平台</p>
        </div>

        <div class="main-content">
            <div class="sidebar">
                <h3>📁 语言包列表</h3>
                <input type="text" class="search-box" id="languageSearch" placeholder="搜索语言...">
                <div class="language-list" id="languageList">
                    <!-- 语言列表将在这里动态生成 -->
                </div>
                
                <div style="margin-top: auto; padding-top: 20px; flex-shrink: 0;">
                    <button class="btn btn-success" onclick="syncAllLanguages()" style="width: 100%; margin-bottom: 10px;">
                        🔄 同步所有语言
                    </button>
                    <button class="btn btn-primary" onclick="exportAllLanguages()" style="width: 100%;">
                        📦 导出所有语言包
                    </button>
                </div>
            </div>

            <div class="content-area">
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="loadLanguageFiles()">
                        📂 加载语言文件
                    </button>
                    <button class="btn btn-success" onclick="saveCurrentLanguage()">
                        💾 保存当前语言
                    </button>
                    <button class="btn btn-warning" onclick="showAddKeyModal()">
                        ➕ 添加新键值
                    </button>
                    <button class="btn btn-primary" onclick="exportLanguage()">
                        📤 导出当前语言
                    </button>
                    <button class="btn btn-primary" onclick="exportAllLanguages()">
                        📦 导出所有语言包
                    </button>
                </div>

                <div class="translation-editor">
                    <div class="editor-header">
                        <div class="editor-title" id="editorTitle">选择一个语言包开始编辑</div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <input type="text" class="search-box" id="keyValueSearch" placeholder="🔍 搜索键名或值..." style="margin-bottom: 0; width: 250px;">
                            <div class="key-count" id="keyCount">0 个键值</div>
                        </div>
                    </div>

                    <div class="loading" id="loadingIndicator">
                        <div class="spinner"></div>
                        <div>正在加载语言文件...</div>
                    </div>

                    <div class="translation-table" id="translationTable">
                        <!-- 翻译表格将在这里动态生成 -->
                    </div>

                    <div class="status-bar">
                        <div class="status-info" id="statusInfo">准备就绪</div>
                        <div class="status-info" id="lastSaved">未保存</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 添加新键值模态框 -->
    <div class="modal" id="addKeyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">添加新键值对</h3>
            </div>
            <div class="form-group">
                <label class="form-label">键名 (Key)</label>
                <input type="text" class="form-input" id="newKeyName" placeholder="输入键名...">
            </div>
            <div class="form-group">
                <label class="form-label">值 (Value)</label>
                <textarea class="form-input" id="newKeyValue" rows="3" placeholder="输入值..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAddKeyModal()">取消</button>
                <button class="btn btn-primary" onclick="addNewKey()">添加</button>
            </div>
        </div>
    </div>

    <script src="translation-gui.js"></script>
</body>
</html>
