version: '3.8'

services:
  translation-gui:
    build: .
    container_name: translation-gui-tool
    ports:
      - "3000:3000"
    volumes:
      # 挂载语言包目录，实现数据持久化
      - ./language-package:/app/language-package
      # 可选：挂载配置文件
      - ./server.js:/app/server.js:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - translation-network

networks:
  translation-network:
    driver: bridge